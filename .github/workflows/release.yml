name: Compile Release

on:
  push:
    branches:
      - experimental
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build CrossPoint (Xteink X4)
        run: pio run -e gh_release

      - name: Debug build outputs (Xteink X4)
        run: |
          echo "== .pio/build =="
          ls -la .pio/build || true
          echo "== .pio/build/gh_release =="
          ls -la .pio/build/gh_release || true

      - name: Build CrossPoint (M5 Paper S3)
        run: pio run -e m5stack-paper-s3

      - name: Debug build outputs (M5 Paper S3)
        run: |
          echo "== .pio/build/m5stack-paper-s3 =="
          ls -la .pio/build/m5stack-paper-s3 || true

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          X4_SRC=".pio/build/gh_release/firmware.bin"
          if [ ! -f "${X4_SRC}" ]; then
            # Fallback: locate any firmware.bin under .pio/build (excluding the Paper S3 output)
            X4_SRC=$(find .pio/build -maxdepth 2 -type f -name firmware.bin ! -path "*/m5stack-paper-s3/*" | head -n 1)
          fi
          if [ -n "${X4_SRC}" ] && [ -f "${X4_SRC}" ]; then
            echo "Using X4 firmware: ${X4_SRC}"
            cp "${X4_SRC}" dist/CrossPoint-XteinkX4.bin
          else
            echo "ERROR: Could not locate X4 firmware.bin"
            echo "Contents of .pio/build:" && ls -la .pio/build || true
            find .pio/build -maxdepth 2 -type f -name firmware.bin -print || true
            exit 1
          fi

          if [ -f .pio/build/m5stack-paper-s3/firmware.bin ]; then
            cp .pio/build/m5stack-paper-s3/firmware.bin dist/CrossPoint-M5PaperS3.bin
          else
            echo "ERROR: Missing .pio/build/m5stack-paper-s3/firmware.bin"
            echo "Contents of .pio/build/m5stack-paper-s3:" && ls -la .pio/build/m5stack-paper-s3 || true
            exit 1
          fi

      - name: Upload Artifacts (Xteink X4)
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-XteinkX4
          path: dist/CrossPoint-XteinkX4.bin

      - name: Upload Artifacts (M5 Paper S3)
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-M5PaperS3
          path: dist/CrossPoint-M5PaperS3.bin

      - name: Compute next tag (0.14.x for experimental)
        id: next_tag
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const versions = tags
              .map(t => t.name)
              .filter(name => /^0\.14\.\d+$/.test(name))
              .map(name => Number(name.split('.')[2]))
              .filter(n => Number.isFinite(n));
            const nextPatch = versions.length ? Math.max(...versions) + 1 : 0;
            const nextTag = `0.14.${nextPatch}`;
            core.setOutput('tag', nextTag);

      - name: Create tag ref
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.next_tag.outputs.tag }}';
            const ref = `refs/tags/${tag}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              sha: process.env.GITHUB_SHA,
            });

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CrossPoint-XteinkX4.bin
            dist/CrossPoint-M5PaperS3.bin
          tag_name: ${{ steps.next_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CrossPoint ${{ steps.next_tag.outputs.tag }}
          generate_release_notes: false
